<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Use public font files, including CJK fallbacks, without bundling Apple fonts. -->
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir>~/Library/Caches/SiliconPlayer/fontconfig</cachedir>
  <alias><family>PingFang SC</family><prefer><family>Heiti SC</family><family>Songti SC</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Helvetica</family><family>Heiti SC</family><family>Arial Unicode MS</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Times New Roman</family><family>Songti SC</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Menlo</family><family>Heiti SC</family></prefer></alias>
</fontconfig>
