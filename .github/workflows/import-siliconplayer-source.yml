name: Import reviewed SiliconPlayer public source once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-siliconplayer-source.yml'

permissions:
  contents: read

concurrency:
  group: siliconplayer-reviewed-source-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-reviewed-source:
    if: github.repository == 'RGB-hengzhi/SiliconPlayer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # Official v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          submodules: false
          lfs: false
      - name: Verify and import only the reviewed source tree
        shell: bash
        run: |
          python3 - <<'PY_IMPORT'
          """One-time reviewed-source import; never execute the imported project."""
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import sys
          import zipfile
          
          REPOSITORY = 'RGB-hengzhi/SiliconPlayer'
          BRANCH = 'refs/heads/main'
          ZIP_NAME = 'siliconplayer-public-release-source-0.6.1.zip'
          ZIP_SHA = '8a78e063311a1c41608186ca739fe4e95cfa3ef11cf38c9153204846d8a313be'
          ZIP_BYTES = 3615230
          CONTROL = 'siliconplayer-source-manifest.json'
          CONTROL_SHA = 'bc99e8ab718dc4b8b19d600aa1ee3e031e926fcdfa13642b1baf1aa2e47027c1'
          WORKFLOW = '.github/workflows/import-siliconplayer-source.yml'
          INITIAL_COMMIT = '298ca3479b2e560c5540a53f3b8a924dd68b5593'
          INITIAL_TREE = '9cb1a9c301cbc05e84d16a397bc64ca7117bc9ab'
          FINAL_TREE = 'b3791f7c6d4069b781a94087f39c0189f27c4af5'
          FILE_COUNT = 538
          TOTAL_BYTES = 8028200
          phase = 'preconditions'
          
          
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          
          
          def safe_path(name):
              require(isinstance(name, str) and 0 < len(name) <= 1024, 'Invalid source path shape')
              require(not any(ord(c) < 32 or ord(c) == 127 for c in name)
                      and '\\' not in name and ':' not in name, 'Unsafe source path characters')
              path = PurePosixPath(name)
              require(not path.is_absolute() and str(path) == name
                      and all(p not in ('', '.', '..') for p in path.parts), 'Noncanonical source path')
              require(all(p.casefold() != '.git' for p in path.parts)
                      and path.parts[0].casefold() != '.github', 'Protected Git path in payload')
              require(name not in (ZIP_NAME, CONTROL), 'Reserved source path in payload')
              return name
          
          
          def validate_archive(path):
              raw = Path(path).read_bytes()
              require(len(raw) == ZIP_BYTES and sha(raw) == ZIP_SHA, 'Reviewed source ZIP pin differs')
              payload = {}
              with zipfile.ZipFile(path) as archive:
                  entries = archive.infolist()
                  require(len(entries) == FILE_COUNT + 1, 'Unexpected archive entry count')
                  names = [info.filename for info in entries]
                  require(len(set(names)) == len(names) and len({n.casefold() for n in names}) == len(names),
                          'Duplicate archive paths')
                  require(names.count(CONTROL) == 1, 'Source manifest entry missing')
                  require(sum(info.file_size for info in entries) < 12 * 1024 * 1024, 'Archive exceeds source bound')
                  for info in entries:
                      mode = info.external_attr >> 16
                      require(info.create_system == 3 and stat.S_ISREG(mode) and not info.is_dir()
                              and not (info.flag_bits & 1), 'Nonregular or encrypted archive entry')
                      if info.filename != CONTROL:
                          safe_path(info.filename)
                  control = archive.read(CONTROL)
                  require(sha(control) == CONTROL_SHA, 'Reviewed source manifest pin differs')
                  manifest = json.loads(control)
                  require(set(manifest) == {'schema', 'fileCount', 'files'} and manifest['schema'] == 1
                          and type(manifest['fileCount']) is int and manifest['fileCount'] == FILE_COUNT,
                          'Unexpected source manifest schema')
                  rows = manifest['files']
                  require(isinstance(rows, list) and len(rows) == FILE_COUNT, 'Source manifest count differs')
                  declared = set()
                  for row in rows:
                      require(isinstance(row, dict) and set(row) == {'path', 'bytes', 'sha256', 'mode'},
                              'Unexpected source manifest row')
                      name = safe_path(row['path'])
                      require(name not in declared, 'Duplicate source manifest path')
                      declared.add(name)
                      require(type(row['bytes']) is int and 0 <= row['bytes'] < 2 * 1024 * 1024
                              and type(row['mode']) is int and row['mode'] in (0o644, 0o755)
                              and isinstance(row['sha256'], str) and re.fullmatch('[0-9a-f]{64}', row['sha256']),
                              'Unexpected source manifest values')
                      info = archive.getinfo(name)
                      require(info.file_size == row['bytes'] and stat.S_IMODE(info.external_attr >> 16) == row['mode'],
                              'Source archive size or mode differs')
                      data = archive.read(info)  # Includes ZIP CRC validation.
                      require(len(data) == row['bytes'] and sha(data) == row['sha256'], 'Source file bytes differ')
                      payload[name] = data
                  require(set(names) == declared | {CONTROL} and sum(len(d) for d in payload.values()) == TOTAL_BYTES,
                          'Unlisted archive file or total-size mismatch')
              return rows, payload
          
          
          def git(*arguments):
              result = subprocess.run(['git', '-c', 'core.hooksPath=/dev/null', '-c', 'commit.gpgsign=false',
                                       *arguments], stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                      stderr=subprocess.PIPE, timeout=120, check=False)
              require(result.returncode == 0, 'Git operation failed; output intentionally withheld')
              return result.stdout
          
          
          def remote_head():
              fields = git('ls-remote', '--exit-code', 'origin', BRANCH).decode('ascii').split()
              require(len(fields) == 2 and re.fullmatch('[0-9a-f]{40}', fields[0]) and fields[1] == BRANCH,
                      'Unexpected remote branch state')
              return fields[0]
          
          
          def worktree_files():
              names = set()
              for directory, directories, files in os.walk('.', followlinks=False):
                  directories[:] = [d for d in directories if d != '.git']
                  for name in directories:
                      require(not (Path(directory) / name).is_symlink(), 'Symlink worktree directory')
                  for name in files:
                      path = Path(directory) / name
                      require(stat.S_ISREG(path.lstat().st_mode), 'Nonregular worktree file')
                      names.add(path.as_posix().removeprefix('./'))
              return names
          
          
          def main():
              global phase
              require(os.environ.get('GITHUB_REPOSITORY') == REPOSITORY
                      and os.environ.get('GITHUB_REF') == BRANCH, 'Unexpected repository or branch')
              start = os.environ.get('GITHUB_SHA', '')
              require(re.fullmatch('[0-9a-f]{40}', start), 'Invalid triggering commit')
              require(git('rev-parse', 'HEAD').decode().strip() == start, 'Checkout is not triggering commit')
              require(git('status', '--porcelain=v1', '--untracked-files=all') == b'', 'Dirty initial checkout')
              require(git('rev-parse', INITIAL_COMMIT + '^{tree}').decode().strip() == INITIAL_TREE,
                      'Existing public source binding differs')
              base_files = set(git('ls-tree', '-r', '--name-only', INITIAL_COMMIT).decode().splitlines())
              require(len(base_files) == 402, 'Existing public source count differs')
              initial_files = base_files | {ZIP_NAME, WORKFLOW}
              require(set(git('ls-files', '-z').decode().rstrip('\0').split('\0')) == initial_files
                      and worktree_files() == initial_files, 'Unexpected existing repository files')
              require(set(git('diff', '--name-only', INITIAL_COMMIT, 'HEAD').decode().splitlines()) == {ZIP_NAME, WORKFLOW},
                      'Existing public files were edited before import')
              git('merge-base', '--is-ancestor', INITIAL_COMMIT, start)
              require(remote_head() == start, 'Branch changed before import')
              phase = 'archive-validation'
              rows, payload = validate_archive(ZIP_NAME)
              phase = 'restore-reviewed-source'
              for row in rows:
                  path = Path(row['path'])
                  path.parent.mkdir(parents=True, exist_ok=True)
                  require(not path.is_symlink() and all(not p.is_symlink() for p in path.parents),
                          'Unexpected destination symlink')
                  require(not path.exists() or row['path'] in base_files, 'Unexpected destination already exists')
                  path.write_bytes(payload[row['path']])
                  path.chmod(row['mode'])
                  require(sha(path.read_bytes()) == row['sha256'] and stat.S_IMODE(path.stat().st_mode) == row['mode'],
                          'Restored source byte or mode mismatch')
              Path(ZIP_NAME).unlink()
              Path(WORKFLOW).unlink()
              require(worktree_files() == set(payload), 'Unexpected final worktree files')
              phase = 'commit-reviewed-source'
              git('-c', 'core.filemode=true', 'add', '--all')
              require(git('write-tree').decode().strip() == FINAL_TREE, 'Reviewed final Git tree differs')
              require(remote_head() == start, 'Branch changed before commit')
              git('config', '--local', 'user.name', 'github-actions[bot]')
              git('config', '--local', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              git('commit', '-m', 'Improve restored-session welcome and external playlist drops; publish validated 0.6.1 guide')
              require(git('rev-parse', 'HEAD^').decode().strip() == start
                      and git('rev-parse', 'HEAD^{tree}').decode().strip() == FINAL_TREE
                      and git('status', '--porcelain=v1', '--untracked-files=all') == b'', 'Final commit binding differs')
              require(remote_head() == start, 'Branch changed before push')
              phase = 'fast-forward-push'
              git('push', 'origin', 'HEAD:' + BRANCH)  # No force, no rebase, no branch overwrite.
              final = git('rev-parse', 'HEAD').decode().strip()
              require(remote_head() == final, 'Remote branch did not confirm imported commit')
              print('Updated 538 reviewed public-source files; temporary workflow and ZIP removed.')
              print('Verified source tree:', FINAL_TREE)
              print('Import commit:', final)
          
          
          if __name__ == '__main__':
              try:
                  main()
              except Exception:
                  # Never print credentials, environment, Git stderr or archive contents.
                  print('::error::Verified import stopped during ' + phase + '; inspect branch state before retrying.')
                  sys.exit(1)
          PY_IMPORT
